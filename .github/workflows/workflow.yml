name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  JAVA_VERSION: '17'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/training-notification
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: notification_db
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myuser -d notification_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Verify application
        run: mvn -B -ntp clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/notification_db
          SPRING_DATASOURCE_USERNAME: myuser
          SPRING_DATASOURCE_PASSWORD: secret
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_MAIL_USERNAME: ci@example.com
          SPRING_MAIL_PASSWORD: ci-placeholder
      - name: Install kubectl
        shell: bash
        run: |
          version=v1.30.2
          base="https://dl.k8s.io/release/${version}/bin/linux/amd64"
          curl --fail --silent --show-error --location --output kubectl "${base}/kubectl"
          curl --fail --silent --show-error --location --output kubectl.sha256 "${base}/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Install kubeconform
        shell: bash
        run: |
          version=0.6.7
          base="https://github.com/yannh/kubeconform/releases/download/v${version}"
          curl --fail --silent --show-error --location --output kubeconform.tar.gz "${base}/kubeconform-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --output CHECKSUMS "${base}/CHECKSUMS"
          grep 'kubeconform-linux-amd64.tar.gz' CHECKSUMS | sha256sum --check
          tar -xzf kubeconform.tar.gz kubeconform
      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          kubectl kustomize k8s/overlays/prod > rendered-k8s.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas rendered-k8s.yaml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
  publish:
    name: Publish image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Package verified commit
        run: mvn -B -ntp -DskipTests package
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable image
        id: publish
        shell: bash
        run: |
          image="${IMAGE_NAME,,}"
          docker build -f dockerfile --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "${image}:${GITHUB_SHA}" .
          push_output="$(docker push "${image}:${GITHUB_SHA}")"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '/digest: sha256:/ {print $2}' | tail -1)"
          test -n "$digest"
          echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"
